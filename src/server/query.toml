# Location of server, which is all that is required to perform a query.
#
# Note that either the client or the server configuration file can be used
# instead if the provided server address is reachable.

[server]
ssh_host = "192.168.0.1"
ssh_port = 22
ssh_auth = { method = "none", user = "user" }
keepalive_every_secs = 60
server_addr_from_host = "127.0.0.1"
server_port_from_host = 47890
accepted_ssh_keys = []
