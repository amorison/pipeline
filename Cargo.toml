[package]
name = "pipeline"
version = "0.11.1"
license = "MIT"
edition = "2024"
rust-version = "1.95"

[dependencies]
bstr = "1.13.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
digest-io = "0.1.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.33", features = ["sink"] }
hex = "0.4.3"
log = "0.4.33"
rpassword = "7.5.4"
russh = { version = "0.62.4", default-features = false, features = ["ring", "serde"] }
serde = {version="1.0.229", features=["derive"]}
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tabled = "0.21.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-serde = { version = "0.9.0", features = ["json"] }
tokio-util = { version = "0.7.19", features = ["full"] }
toml = "1.1.3"
walkdir = "2.5.0"
zeroize = "1.9.0"

[profile.release]
lto = true
codegen-units = 1
